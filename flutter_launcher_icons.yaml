# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/ic.png"

  adaptive_icon_background: "assets/images/ic_background.png"
  adaptive_icon_foreground: "assets/images/ic_foreground.png"

  android: "launcher_icon"
  min_sdk_android: 21 # android min sdk min:16, default 21

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/images/ic.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"

  windows:
    generate: true
    image_path: "assets/images/ic.png"
    icon_size: 48 # min:48, max:256, default: 48

  macos:
    generate: true
    image_path: "assets/images/ic.png"
